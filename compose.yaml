name: vestry-local

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: vestry
      POSTGRES_USER: vestry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vestry -d vestry"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: local-compose
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/vestry
      SPRING_DATASOURCE_USERNAME: vestry
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      TIINGO_API_TOKEN: ${TIINGO_API_TOKEN:?Set TIINGO_API_TOKEN in .env}
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      # An unauthenticated session check must reach the application and return 401.
      test: ["CMD-SHELL", "test \"$$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://localhost:8080/api/auth/me)\" = 401"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 12

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    environment:
      VESTRY_API_PROXY_TARGET: http://api:8080
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./apps/web/src:/app/src:ro
      - ./apps/web/public:/app/public:ro
      - ./apps/web/index.html:/app/index.html:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
