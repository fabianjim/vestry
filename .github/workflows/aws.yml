name: Deploy to AWS

# deploys only after the backend tests pass on main
on:
  workflow_run:
    workflows: [Build and Test]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# hindsight's ci uses the same name, but concurrency groups are per repository; deploy.sh waits instead
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    # the instance is a graviton t4g, so images build natively on arm
    runs-on: ubuntu-24.04-arm
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      COMMIT: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install the AWS CLI and zip if missing
        run: |
          command -v zip >/dev/null || sudo apt-get install -y -qq zip
          if ! command -v aws >/dev/null; then
            curl -sSfL https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip -o /tmp/awscli.zip
            unzip -q /tmp/awscli.zip -d /tmp && sudo /tmp/aws/install
          fi

      - name: Push the vestry image
        run: deploy/push-image.sh vestry-api services/api services/api/Dockerfile.dev "$COMMIT"

      - name: Deploy to Elastic Beanstalk
        run: deploy/deploy.sh "vestry ${COMMIT:0:12}"
