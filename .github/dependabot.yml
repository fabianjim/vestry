version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns:
          - '*'

  - package-ecosystem: maven
    directory: /services/api
    schedule:
      interval: weekly
    groups:
      maven-dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
