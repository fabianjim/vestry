# default is set to dev for local build, no need to set env variable
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.servlet.session.timeout=2h

# AI remains off until both activation and an explicit lifetime allowance are configured.
vestry.ai.enabled=${VESTRY_AI_ENABLED:false}
vestry.ai.api-key=${OPENAI_API_KEY:}
vestry.ai.lifetime-budget-micros=${VESTRY_AI_LIFETIME_BUDGET_MICROS:0}
vestry.ai.daily-budget-micros=${VESTRY_AI_DAILY_BUDGET_MICROS:200000}
vestry.ai.daily-generations=${VESTRY_AI_DAILY_GENERATIONS:5}
