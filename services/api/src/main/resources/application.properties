# default is set to dev for local build, no need to set env variable
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.servlet.session.timeout=2h

# Hindsight's read-only view, created after Hibernate builds the tables. A failure is logged and never stops startup.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/core_read.sql
spring.sql.init.continue-on-error=true
# Spring reports a failed statement only at debug when continuing on error.
logging.level.org.springframework.jdbc.datasource.init.ScriptUtils=DEBUG

vestry.google.client-id=${GOOGLE_CLIENT_ID:}

# Hindsight, the AI service. A blank URL or token turns its insights and briefings off.
vestry.hindsight.url=${HINDSIGHT_URL:}
vestry.hindsight.token=${HINDSIGHT_SERVICE_TOKEN:}

# Run-up EOD requests, shared with the hourly price fetches under Tiingo's free plan (50 an hour, 1000 a day).
vestry.run-up.hourly-limit=${VESTRY_RUN_UP_HOURLY_LIMIT:30}
vestry.run-up.daily-limit=${VESTRY_RUN_UP_DAILY_LIMIT:300}

