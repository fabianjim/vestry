# default is set to dev for local build, no need to set env variable
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.servlet.session.timeout=2h

# Hindsight's read-only view, created after Hibernate builds the tables. A failure is logged and never stops startup.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/core_read.sql
spring.sql.init.continue-on-error=true
# Spring reports a failed statement only at debug when continuing on error.
logging.level.org.springframework.jdbc.datasource.init.ScriptUtils=DEBUG

vestry.google.client-id=${GOOGLE_CLIENT_ID:}

# AI requires activation and an API key. An omitted lifetime limit is uncapped; daily limits still apply.
vestry.ai.enabled=${VESTRY_AI_ENABLED:false}
vestry.ai.api-key=${OPENAI_API_KEY:}
# USD settings take precedence when supplied. Blank values retain legacy settings/defaults below.
vestry.ai.lifetime-budget-usd=${VESTRY_AI_LIFETIME_BUDGET_USD:}
vestry.ai.daily-budget-usd=${VESTRY_AI_DAILY_BUDGET_USD:}
vestry.ai.lifetime-budget-micros=${VESTRY_AI_LIFETIME_BUDGET_MICROS:-1}
vestry.ai.daily-budget-micros=${VESTRY_AI_DAILY_BUDGET_MICROS:200000}
vestry.ai.daily-generations=${VESTRY_AI_DAILY_GENERATIONS:5}

# Backend-only credentials. Full content is restricted to demo and synthetic evaluation runs.
vestry.langfuse.enabled=${LANGFUSE_TRACING_ENABLED:false}
vestry.langfuse.base-url=${LANGFUSE_BASE_URL:https://us.cloud.langfuse.com}
vestry.langfuse.public-key=${LANGFUSE_PUBLIC_KEY:}
vestry.langfuse.secret-key=${LANGFUSE_SECRET_KEY:}
vestry.langfuse.environment=${LANGFUSE_TRACING_ENVIRONMENT:development}
vestry.langfuse.release=${LANGFUSE_RELEASE:}
