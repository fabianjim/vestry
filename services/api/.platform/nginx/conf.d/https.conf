# the hooks link these paths to a placeholder, then to the let's encrypt cert
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/pki/tls/certs/vestry-api.crt;
    ssl_certificate_key /etc/pki/tls/private/vestry-api.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # same upstream as the platform's port 80 server (server.port in application-prod.properties)
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}
